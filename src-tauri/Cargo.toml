[package]
name = "lattira"
version = "0.1.0"
description = "栖页 · Lattira：画布式知识库与文件管理"
edition = "2021"
publish = false

[lib]
name = "lattira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
thiserror = "2"
mime_guess = "2"
imagesize = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
